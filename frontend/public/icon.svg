<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="fieldops-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F97316" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Gradient Background Tile -->
  <rect width="32" height="32" rx="8" fill="url(#fieldops-grad)" filter="url(#glow)" />

  <!-- Inner Shield Outline & Checkmark -->
  <path
    d="M16 6.5L9 9.5V15C9 19.5 12 23.5 16 25.5C20 23.5 23 19.5 23 15V9.5L16 6.5Z"
    fill="white"
    fill-opacity="0.2"
    stroke="white"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Checkmark -->
  <path
    d="M13.5 15.5L15.5 17.5L19 13"
    stroke="white"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
