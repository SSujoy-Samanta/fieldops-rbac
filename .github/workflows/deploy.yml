# ==============================================================================
# Deploy — Production Deployment
# Frontend → Vercel | Backend → Render or VPS (choose one section below)
# ==============================================================================
# Triggers automatically after CI passes on main branch.
# Can also be triggered manually via GitHub Actions UI.
# ==============================================================================
# REQUIRED GitHub Secrets (Settings → Secrets → Actions):
#
# Shared:
#   NEXT_PUBLIC_API_URL        e.g. https://fieldops-api.render.com
#   NEXT_PUBLIC_APP_URL        e.g. https://fieldops.vercel.app
#
# Frontend (Vercel):
#   VERCEL_TOKEN               From vercel.com → Settings → Tokens
#   VERCEL_ORG_ID              From frontend/.vercel/project.json
#   VERCEL_PROJECT_ID          From frontend/.vercel/project.json
#
# Backend — Option A (Render):
#   RENDER_DEPLOY_HOOK_URL     From Render dashboard → Settings → Deploy Hook
#
# Backend — Option B (VPS via Docker):
#   VPS_HOST                   VPS IP address
#   VPS_USER                   SSH username (e.g. ubuntu)
#   VPS_SSH_KEY                Full contents of your private SSH key
#   DOCKER_HUB_USERNAME        Docker Hub username
#   DOCKER_HUB_TOKEN           Docker Hub access token
#   DATABASE_URL               Production Postgres connection string
#   REDIS_URL                  Production Redis connection string
#   JWT_SECRET                 Production JWT secret
#   GOOGLE_CLIENT_ID           Google OAuth client ID
#   GOOGLE_CLIENT_SECRET       Google OAuth client secret
# ==============================================================================

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  # ── 1. Deploy Frontend → Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    environment:
      name: production
      # url: https://your-app.vercel.app  ← Replace with your real Vercel URL after first deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Install Vercel CLI
      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      # Pull Vercel project settings (links to your Vercel project)
      - name: Pull Vercel Environment Info
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build on Vercel's infrastructure (handles Next.js natively)
      - name: Build Project on Vercel
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Deploy the pre-built output to production
      - name: Deploy to Vercel Production
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 2A. Deploy Backend → Render (Simple: Deploy Hook) ──────────────────────
  # Comment out this job if using VPS instead (section 2B below).
  deploy-backend-render:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      # Trigger Render's deploy hook — Render pulls from GitHub and redeploys.
      # No Docker push needed; Render builds from source directly.
      - name: Trigger Render Deploy Hook
        run: |
          curl -s --fail-with-body \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Render deploy triggered successfully."

  # ── 2B. Deploy Backend → VPS via Docker ────────────────────────────────────
  # Uncomment this job and comment out deploy-backend-render if using VPS.
